[workspace]
members = [
    "crates/diamond-core",
    "crates/diamond-document",
    "crates/diamond-vault",
    "crates/diamond-editor",
    "crates/diamond-plugin",
    "crates/diamond-app",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
egui = "=0.33.0"
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
pulldown-cmark = "=0.13.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
regex = "1"
resvg = { version = "=0.45.1", default-features = false }
notify = { version = "=8.2.0", default-features = false }
ashpd = { version = "=0.11.0", default-features = false, features = ["async-std"] }
pollster = "0.4"
latex-rust = { version = "=2.1.1", default-features = false, features = ["std"] }
syntect = { version = "=5.2.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
diamond-core = { path = "crates/diamond-core" }
diamond-document = { path = "crates/diamond-document" }
diamond-vault = { path = "crates/diamond-vault" }
diamond-editor = { path = "crates/diamond-editor" }
diamond-plugin = { path = "crates/diamond-plugin" }

[profile.release]
lto = "thin"
strip = true

